<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; connect-src 'self' https://thedoggybrad.github.io; img-src 'self' data: blob:; media-src 'self' data: blob:; worker-src 'self' blob:; child-src blob:">
    <title>DOOM on JS-DOS</title>
    <link rel="preload" href="/doom/js-dos-v3.js?v=20260727-6" as="fetch" crossorigin>
    <link rel="preconnect" href="https://thedoggybrad.github.io" crossorigin>
    <link rel="preload" href="https://thedoggybrad.github.io/doom_on_js-dos/DOOM-@evilution.zip" as="fetch" crossorigin>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        background: #080808;
        color: #f4f4f4;
        font: 14px/1.4 system-ui, sans-serif;
      }
      main { width: min(100%, 680px); padding: 12px 20px 18px; text-align: center; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 10px; }
      h1 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
      header a, footer a { color: #a9c9ff; }
      #DOOM > .dosbox-container { width: 640px; height: 400px; max-width: 100%; margin: auto; }
      #DOOM > .dosbox-container > .dosbox-overlay {
        background:
          radial-gradient(circle at 50% 42%, rgba(215, 76, 30, .6), transparent 25%),
          linear-gradient(150deg, #23120f 0 38%, #711d11 38% 54%, #17100e 54% 100%);
      }
      #DOOM > .dosbox-container > .dosbox-overlay > .dosbox-start {
        width: 10em;
        margin: 0 auto;
        padding: 8px;
        border-radius: 8px;
        background: rgba(14, 14, 14, .72);
      }
      footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 10px; color: #929292; font-size: 11px; }
    </style>
    <script src="/doom/js-dos-api.js?v=20260727-6"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>DOOM on JS-DOS</h1>
        <a href="/downloads/MANUAL.md" target="_blank" rel="noreferrer">Local manual ↗</a>
      </header>
      <div id="DOOM" class="dosbox-default"></div>
      <footer>
        <span>Embedded from thedoggybrad/doom_on_js-dos</span>
        <a id="fullscreen" href="#">Fullscreen</a>
      </footer>
    </main>
    <script>
      const game = new Dosbox({
        id: "DOOM",
        onload(dosbox) {
          game.run("https://thedoggybrad.github.io/doom_on_js-dos/DOOM-@evilution.zip", "./DOOM/DOOM.EXE");
        }
      });
      document.getElementById("fullscreen").addEventListener("click", (event) => {
        event.preventDefault();
        game.requestFullScreen();
      });
    </script>
  </body>
</html>
