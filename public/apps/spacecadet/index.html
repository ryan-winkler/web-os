<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; connect-src https://pinball.alula.me; img-src data:; media-src https://pinball.alula.me; script-src 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://pinball.alula.me; style-src 'unsafe-inline'; worker-src blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Cadet Pinball</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      body { display: grid; place-items: center; color: #dbe8f8; font: 13px/1.4 system-ui, sans-serif; }
      canvas { width: 100%; height: 100%; display: block; object-fit: contain; outline: 0; }
      #status { position: absolute; padding: 10px 14px; border: 1px solid #34506f; background: #0a1522; }
    </style>
  </head>
  <body>
    <p id="status" role="status">Loading Space Cadet…</p>
    <canvas id="canvas" tabindex="0" aria-label="Space Cadet Pinball game"></canvas>
    <script>
      const canvas = document.getElementById("canvas");
      const status = document.getElementById("status");
      canvas.addEventListener("contextmenu", (event) => event.preventDefault());
      var Module = {
        canvas,
        locateFile: (path) => `https://pinball.alula.me/${path}`,
        print: console.info,
        printErr: console.error,
        setStatus(message) {
          status.textContent = message || "";
          status.hidden = !message;
          if (!message) canvas.focus();
        },
      };
      window.addEventListener("error", () => {
        status.hidden = false;
        status.textContent = "Space Cadet could not start. Open the source link for runtime status.";
      });
    </script>
    <script async src="https://pinball.alula.me/SpaceCadetPinball.js"></script>
  </body>
</html>
